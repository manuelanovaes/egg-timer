<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Egg Timer</title>
</head>
<body>
    <div id="timer" class="timer">00:00</div>
    <div class="btnDureza">
        <button id="btn-mole">Gema mole</button>
        <button id="btn-media">Gema média</button>
        <button id="btn-dura">Gema dura</button>
    </div>
    <div class="btnCancelarPausar">
        <button id="btn-pausar" class="btn-pausar">Pausar</button>
        <button id="btn-cancelar" class="btn-cancelar">Cancelar timer</button>
        <div id="alert-cancelar">
            <div class="confirmarCancelamento">
                <p>Cancelar a contagem do timer?</p>
                <div class="confirmarBtn">
                    <button id="btn-sim">Sim</button>
                    <button id="btn-nao">Não</button>
                </div>
            </div>
        </div>
    </div>
    <div class="novoOvo">
        <button id="novo-ovo">Cozinhar outro ovo</button>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
